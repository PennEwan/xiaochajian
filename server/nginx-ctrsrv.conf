# /etc/nginx/conf.d/ctrsrv.conf — ctrsrv 前的 TLS 反向代理
#
# 用途：后台自己只会说明文 HTTP（见 docs/backend.md §5），公网出口必须是这一个块。
# 放进 conf.d/ 时本文件已经在 `http { … }` 内，所以 limit_req_zone 可以写在这里。
#
# 部署：
#   sudo install -m 0644 server/nginx-ctrsrv.conf /etc/nginx/conf.d/ctrsrv.conf
#   sudo sed -i 's/ctrsrv\.example\.com/你的域名/g' /etc/nginx/conf.d/ctrsrv.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # 后台只监听 127.0.0.1（--host 127.0.0.1），不要改成 0.0.0.0

# 每个设备每分钟 120 批是后台自己的预算；这里只兜住明显的滥用，不要把正常客户端卡死
limit_req_zone $binary_remote_addr zone=ctrsrv_redeem:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ctrsrv_admin:10m rate=10r/m;

upstream ctrsrv_backend {
    server 127.0.0.1:8080;
    keepalive 16;                       # 后台是 HTTP/1.1 + keep-alive
}

# 80 端口只做一件事：把客户端拽到 https
server {
    listen 80;
    listen [::]:80;
    server_name ctrsrv.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                           # nginx < 1.25.1 改成: listen 443 ssl http2;
    server_name ctrsrv.example.com;

    ssl_certificate     /etc/letsencrypt/live/ctrsrv.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctrsrv.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ctrsrv_tls:10m;
    ssl_session_timeout 1h;

    # 后台的上限是 8 MiB（app.py MAX_BODY）。这里放到 9 MiB，让超限由后台自己回
    # `413 {"error":{"code":"batch_too_large"}}`——客户端认这个码，会拆批重发；
    # 若让 nginx 先拦，客户端拿到的是 HTML 413，只能当暂时错误一直重试。
    client_max_body_size 9m;
    client_body_timeout  30s;
    client_body_buffer_size 256k;

    # 8 MiB 的批不要先落盘再转发：边收边转，也让后台能尽早按 Content-Length 回 413
    # 代价：本指令会把 `Transfer-Encoding: chunked` 原样转给后台，而后台只认 Content-Length
    # （chunked 正文被当空正文）。本仓库客户端都带长度，所以默认这么配；若有第三方客户端会发
    # chunked，改成 `proxy_request_buffering on`——nginx 缓冲完整批后带 Content-Length 转发，
    # 代价是每批最多 9 MB 落盘。两者不能兼得。
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;
    # 后台从不返回 3xx（客户端把 POST 的 3xx 当「结果未知」），别让 nginx 自作主张改写
    proxy_redirect off;

    # 访问日志里只会有路径，没有令牌、没有正文；查询串由后台自己也不记
    access_log /var/log/nginx/ctrsrv.access.log;
    error_log  /var/log/nginx/ctrsrv.error.log warn;

    location / {
        proxy_pass http://ctrsrv_backend;
    }

    # 运维面：默认只允许内网 / 跳板机。管理令牌一旦泄露，/admin/* 能删库、能停设备。
    # 没有内网时至少加一层 basic auth，且不要把 /admin/ 开给公网。
    location /admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        limit_req zone=ctrsrv_admin burst=10 nodelay;
        proxy_pass http://ctrsrv_backend;
    }

    # 兑换接口没有令牌（recharge-api.md §1），无限速时可以直接被拿去撞 CDK
    location = /v1/redemptions {
        limit_req zone=ctrsrv_redeem burst=20 nodelay;
        proxy_pass http://ctrsrv_backend;
    }

    # 事件上报：一条连接可能连发很多批，别在这里限速（后台按设备 120 批/分自己管）
    location = /v1/events/batch {
        proxy_pass http://ctrsrv_backend;
    }
}
